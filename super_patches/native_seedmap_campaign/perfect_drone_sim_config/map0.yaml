#############| For UAV simulation |#################################
# "map0" -- one of the maps bundled in the SUPER paper's own official
# Zenodo data release (doi.org/10.5281/zenodo.14528604, file
# mock_map_opt_26121_20.pcd), NOT the public GitHub demo map (that is
# seed11/dense.yaml -> random_map_2_26609.pcd). Bounding box matches the
# paper's stated benchmark geometry: x in [-7.5,7.5], y in [-55,55],
# i.e. the same +-7.5 x 110 m corridor scale, goal ~100 m from start.
# Start/goal chosen by scanning for the largest local point clearance
# near y=-49/+49 (both ~0.60 m to nearest obstacle point).
pcd_name: "map0.pcd"
mesh_resource: "package://perfect_drone_sim/meshes/yunque-M.dae"
init_position:
  x: 3.25
  y: -49
  z: 1.5
init_yaw: 1.630

#############|For LiDAR perception simulation |#################################
is_360lidar: true
polar_resolution: 0.4
downsample_res: 0.1
vertical_fov: 178.0
sensing_blind: 0.1
sensing_horizon: 15
sensing_rate: 10
print_time_consumption: false
lidar_type: 2
depth_image_en: false
